apiVersion: v1
kind: Namespace
metadata:
  name: cloudstack-images
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage
  namespace: cloudstack-images
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/objects"
    db_engine = "sqlite"
    metadata_fsync = true
    data_fsync = true
    replication_factor = 1
    compression_level = "none"
    rpc_bind_addr = "127.0.0.1:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    public_endpoint = "https://s3.cloud.snucse.org"
    public_endpoint_path_style = true

    [s3_web]
    bind_addr = "[::]:3902"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: cloudstack-images
spec:
  selector:
    app.kubernetes.io/name: cloudstack-images
  ports:
    - name: s3
      port: 3900
    - name: web
      port: 3902
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: cloudstack-images
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudstack-images
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudstack-images
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
          command: [/garage]
          args: [server, --single-node, --default-bucket]
          envFrom:
            - secretRef:
                name: garage
          env:
            - name: GARAGE_DEFAULT_BUCKET
              value: images.cloud.snucse.org
          ports:
            - name: s3
              containerPort: 3900
            - name: web
              containerPort: 3902
          readinessProbe:
            tcpSocket:
              port: s3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: garage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: rbd
        resources:
          requests:
            storage: 100Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: images-s3
  namespace: cloudstack-images
spec:
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-cloud-snucse-org
  hostnames: [s3.cloud.snucse.org]
  rules:
    - backendRefs:
        - name: garage
          port: 3900
      timeouts:
        request: 0s
        backendRequest: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: images-web
  namespace: cloudstack-images
spec:
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-cloud-snucse-org
  hostnames: [images.cloud.snucse.org]
  rules:
    - backendRefs:
        - name: garage
          port: 3902
      timeouts:
        request: 0s
        backendRequest: 0s
