name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_CONFIG_FILE: ${{ github.workspace }}/.github/aws-config

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [a100, gtx1080]
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          bash -n build_image.sh deploy.sh
          shellcheck build_image.sh deploy.sh
          python3 -m py_compile publish.py
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils libguestfs-tools
      - name: Build qcow2
        env:
          PROFILE: ${{ matrix.profile }}
        run: sudo ./deploy.sh "$PROFILE" "out/bacchus-ubuntu-26.04-$PROFILE.qcow2"
      - name: Publish image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PROFILE: ${{ matrix.profile }}
          IMAGE_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: python3 publish.py image "$PROFILE" "out/bacchus-ubuntu-26.04-$PROFILE.qcow2"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: catalog-${{ matrix.profile }}
          path: out/*.json
          if-no-files-found: error
          retention-days: 7

  catalog:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-*
          path: out
          merge-multiple: true
      - name: Publish template catalog
        env:
          IMAGE_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
          AWS_ENDPOINT_URL: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: python3 publish.py catalog out
