name: Diagnose appliance networking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare appliance
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor isc-dhcp-client libguestfs-tools tcpdump
          sudo apparmor_parser --replace .github/passt.apparmor
          sudo chmod a+r /boot/vmlinuz-*
          printf 'KERNEL=="kvm", OWNER="%s", GROUP="kvm", MODE="0660"\n' "$(id -u)" | sudo tee /etc/udev/rules.d/99-cloudstack-image-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --action=add --name-match=/dev/kvm
          sudo udevadm settle --timeout=30
          printf 'timeout 10;\n' | sudo tee /etc/dhcp/dhclient.conf
      - name: Capture DHCP exchange
        env:
          LIBGUESTFS_BACKEND: direct
          LIBGUESTFS_BACKEND_SETTINGS: force_kvm
        run: |
          guestfish --network --verbose -a /dev/null <<'EOF'
          config -object filter-dump,id=dhcp,netdev=usernet,file=/tmp/guestfs-network.pcap
          run
          debug sh "ip -4 addr; ip -4 route"
          debug sh "dhclient -d -v -1 eth0"
          EOF
      - name: Read packets and audit log
        if: always()
        run: |
          sudo journalctl -k --no-pager --since='-15 minutes' --grep='apparmor="DENIED"'
          sudo tcpdump -nn -vv -r /tmp/guestfs-network.pcap
